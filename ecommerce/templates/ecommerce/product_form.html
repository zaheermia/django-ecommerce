{% extends 'ecommerce/base.html' %}

{% block content %}
    {% if product %}
        <h1>Edit Product</h1>
    {% else %}
        <h1>Add a Product to {{ store.name }}</h1>
    {% endif %}

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        <p>Name: <input type="text" name="name" value="{{ name|default:'' }}"></p>
        <p>Description:<br>
            <textarea name="description" rows="4" cols="40">{{ description|default:'' }}</textarea>
        </p>
        <p>Price (R): <input type="number" name="price" step="0.01" min="0" value="{{ price|default:'' }}"></p>
        <p>Stock: <input type="number" name="stock" min="0" value="{{ stock|default:'' }}"></p>
        <button type="submit">Save</button>
    </form>

    <p><a href="{% url 'my_products' %}">Back</a></p>
{% endblock %}
