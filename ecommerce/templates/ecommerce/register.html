{% extends 'ecommerce/base.html' %}

{% block content %}
    <h1>Register</h1>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        <p>Username: <input type="text" name="username" value="{{ username|default:'' }}"></p>
        <p>Email: <input type="email" name="email" value="{{ email|default:'' }}"></p>
        <p>Password: <input type="password" name="password"></p>
        <p>Confirm password: <input type="password" name="password2"></p>
        <p>
            I want to:
            <input type="radio" name="account_type" value="buyer" checked> Buy
            <input type="radio" name="account_type" value="vendor"> Sell (vendor)
        </p>
        <button type="submit">Register</button>
    </form>

    <p>Already have an account? <a href="{% url 'login' %}">Login</a></p>
{% endblock %}
