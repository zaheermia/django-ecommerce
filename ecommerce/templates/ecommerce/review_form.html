{% extends 'ecommerce/base.html' %}

{% block content %}
    <h1>Edit Review for {{ review.product.name }}</h1>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        <p>
            Rating:
            <select name="rating">
                <option value="5" {% if rating == 5 %}selected{% endif %}>5 - Great</option>
                <option value="4" {% if rating == 4 %}selected{% endif %}>4 - Good</option>
                <option value="3" {% if rating == 3 %}selected{% endif %}>3 - OK</option>
                <option value="2" {% if rating == 2 %}selected{% endif %}>2 - Bad</option>
                <option value="1" {% if rating == 1 %}selected{% endif %}>1 - Terrible</option>
            </select>
        </p>
        <p>Comment:<br>
            <textarea name="comment" rows="3" cols="40">{{ comment }}</textarea>
        </p>
        <button type="submit">Save</button>
    </form>

    <p><a href="{% url 'review_list' %}">Back</a></p>
{% endblock %}
